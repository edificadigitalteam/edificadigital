name: Frontend checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches:
      - 'feature/digen-evaluaciones-calendario-20261021'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run feature regression tests
        run: node --test src/features/management/reportUrgentFixes.test.js src/features/evaluation/evaluation.test.js src/features/management/evaluationNavigation.test.js src/features/calendar/calendar.test.js src/features/calendar/presentation.test.js src/features/calendar/annualHeader.test.js src/features/calendar/associationNotices.test.js src/features/calendar/associationNoticesIntegration.test.js src/features/calendar/calendarHeaderIntegration.test.js src/features/management/unitScope.test.js src/features/members/membersTranslations.test.js
      - name: Run full legacy unit suite (baseline audit)
        continue-on-error: true
        run: pnpm test
      - name: Run lint
        run: pnpm lint
      - name: Build production frontend
        run: pnpm build
