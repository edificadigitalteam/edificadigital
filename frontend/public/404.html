<!doctype html>
<html lang="es">

    <style>

      .en { color: #4c3f63; border-top: 1px solid #e4def0; padding-top: 16px; margin-top: 24px; }
      .en h2 { margin: 0 0 8px; font-size: 1.25rem; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 20px; border-radius: 999px; background: #5b2e91; color: #fff; font-weight: 700; text-decoration: none; }

      a:hover { background: #4a2477; }

  <body>
    <main>
      <p class="code">404</p>
