          { "@type": "Question", "name": "¿Qué planes de suscripción existen?", "acceptedAnswer": { "@type": "Answer", "text": "Edifica ofrece tres planes: Esencial (equipos pequeños que comienzan con un módulo principal), Organización (varios operadores y procesos activos, con módulos combinables) y Ecosistema (implementación amplia, con todos los módulos contratados y soporte prioritario)." } },
